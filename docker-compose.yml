version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./docker/backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html/public:cached
    depends_on:
      - backend
      - frontend
    networks:
      - app_net

  backend:
    build:
      context: .
      dockerfile: docker/backend/php/Dockerfile
    container_name: backend
    restart: unless-stopped
    volumes:
      - ./backend/src:/var/www/html/src:cached
      - ./backend/public:/var/www/html/public:cached
    command: php-fpm
    expose:
      - "9000"
    depends_on:
      - mariadb
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/node/Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=false
      - NODE_ENV=development
    volumes:
      - ./frontend:/frontend:cached
      - frontend_node_modules:/frontend/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - app_net

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  mariadb_data:
  frontend_node_modules: