# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    App\Service\SerializerService:
        arguments:
            - 'Symfony\Component\Serializer\SerializerInterface'

    App\Service\LogService:
        arguments:
            - 'Symfony\Component\HttpKernel\KernelInterface'
            - 'Psr\Log\LoggerInterface'

    App\Controller\Api\ApiOrderController:
        arguments:
            - '@App\Service\LogService'
            - '@App\Service\SerializerService'
        tags: [ 'api_order_controller.log_service','api_order_controller.serializer_service' ]

    App\Controller\Api\ApiProductController:
        arguments:
            - '@App\Service\LogService'
            - '@App\Service\SerializerService'
        tags: [ 'api_product_controller.log_service','api_product_controller.serializer_service' ]

    App\Controller\Api\ApiStockController:
        arguments:
            - '@App\Service\LogService'
            - '@App\Service\SerializeService'
        tags: [ 'api_stock_controller.log_service','api_stock_controller.serialize_service' ]

    App\Service\OrderService:
        arguments:
            - 'EntityManagerInterface'
            - 'App\Repository\ProductRepository'
            - 'App\Repository\StockRepository'
            - 'App\Service\StockService'

    App\Service\StockService:
        arguments:
            - 'EntityManagerInterface'
            - 'App\Repository\StockRepository'

    # default configuration for services in *this* file

    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
